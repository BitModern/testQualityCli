name: Release Workflow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# npm trusted publishing (OIDC): npm trusts this workflow in the Release
# environment directly, so there is no NPM_TOKEN to expire or leak. Configured
# on npmjs.com under @testquality/cli -> Settings -> Trusted Publisher.
permissions:
  contents: write # attach binaries to the GitHub release
  id-token: write # OIDC token for npm trusted publishing

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1. Node 24 is
          # what pkg was verified on; the binaries still embed node16 (pkg target).
          node-version: 24
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Set Yarn version
        run: corepack prepare yarn@4.9.2 --activate
      - run: yarn install --immutable

      - name: Build library
        run: yarn build

      - name: Publish to npm
        run: npm publish

      - name: Build binaries
        run: yarn package

      - name: Release binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            commands/testquality-alpine
            commands/testquality-linux
            commands/testquality-macos
            commands/testquality-win.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
